name: E2DE Tests

on: 
    pull_request:
        branches:
            - main
    push:
        branches:
            - dev
            - main
    workflow_dispatch:

jobs:
    cypress_run:
        runs-on: ubuntu-latest

        steps:
        # Checkout the code base
        - name: Checkout repository
        uses: actions/checkout@v7

        - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
        node-version: 24
        # Caches the downloaded packages betwix workflows...makes it faster
        cache: npm  
        
        - name: Install dependencies
        run: npm ci

        - name: execute cypress
        uses: cypress-io/github-action@v7


